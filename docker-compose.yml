version: '3.8'

services:
  voice-concierge:
    build:
      context: .
      dockerfile: Dockerfile
    image: voice-concierge:latest
    container_name: voice-concierge
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./traces:/app/traces
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VECTOR_STORE_PATH=/app/data/vector_store
    command: ["--audio", "/app/data/meeting_recording.mp3", "--output", "/app/data/presentations/output.pptx"]
